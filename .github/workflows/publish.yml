name: Build site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Verify profile snapshot
        run: |
          python3 scripts/build_profile.py
          git diff --exit-code -- index.html
      - name: Build Jekyll site
        run: bundle exec jekyll build --destination build/site
        env:
          JEKYLL_ENV: production
